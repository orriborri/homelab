apiVersion: v1
kind: PersistentVolume
metadata:
  name: hermes-bilder
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  # Required binding metadata; this does not allocate or limit NAS capacity.
  capacity:
    storage: 1Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    name: hermes-bilder
    namespace: hermes
  mountOptions:
    - ro
    - nosuid
    - nodev
    - noexec
    - vers=3.0
    - uid=10000
    - gid=10000
    - dir_mode=0550
    - file_mode=0440
    - noserverino
  csi:
    driver: smb.csi.k8s.io
    readOnly: true
    volumeHandle: 192.168.1.244#hermes-readonly#Bilder
    volumeAttributes:
      source: //192.168.1.244/Bilder
    nodeStageSecretRef:
      name: hermes-smb-credentials
      namespace: hermes
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-bilder
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: hermes-bilder
  resources:
    requests:
      storage: 1Gi
