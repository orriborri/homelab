apiVersion: apps/v1
kind: Deployment
metadata:
  name: grocy-stocker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grocy-stocker
  template:
    metadata:
      labels:
        app: grocy-stocker
    spec:
      containers:
        - name: grocy-stocker
          image: ghcr.io/orriborri/homelab-grocy-stocker:c4f602e7c295b6d371f8c34f063953d4cea2a5a7@sha256:5fc0e959c8e529c93baa97ec10c28797644540616367c900c6d1dc68681157d9
          env:
            - name: GROCY_URL
              value: http://grocy.default.svc.cluster.local
            - name: LOCATION_ID
              value: "3" # Keittiö
            - name: GROCY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: grocy-stocker
                  key: GROCY_API_KEY
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
