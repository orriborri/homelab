apiVersion: apps/v1
kind: Deployment
metadata:
  name: grocy-stocker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grocy-stocker
  template:
    metadata:
      labels:
        app: grocy-stocker
    spec:
      containers:
        - name: grocy-stocker
          image: ghcr.io/orriborri/homelab-grocy-stocker:3c85641ca71bf0296dcdad16cf8307983a558e92@sha256:2ace04308bf3b705836190a5e780d083c5eb28456d7f7dc606d3cafc48e02a0d
          env:
            - name: GROCY_URL
              value: http://grocy.default.svc.cluster.local
            - name: LOCATION_ID
              value: "3" # Keittiö
            - name: GROCY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: grocy-stocker
                  key: GROCY_API_KEY
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
