apiVersion: apps/v1
kind: Deployment
metadata:
  name: grocy-stocker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grocy-stocker
  template:
    metadata:
      labels:
        app: grocy-stocker
    spec:
      containers:
        - name: grocy-stocker
          image: ghcr.io/orriborri/homelab-grocy-stocker:8d0b28ef0bd66525839027177c7b1f7bbbb7311f@sha256:625dee117960f86ba0912ee83fa744fbaa08ac9a7e13845d927aeca15a4ddc9d
          env:
            - name: GROCY_URL
              value: http://grocy.default.svc.cluster.local
            - name: LOCATION_ID
              value: "3" # Keittiö
            - name: GROCY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: grocy-stocker
                  key: GROCY_API_KEY
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
