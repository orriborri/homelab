apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grocy-stocker
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: private
  tls:
    - secretName: orriborri-com-tls
      hosts:
        - stock.orriborri.com
  rules:
    - host: stock.orriborri.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grocy-stocker
                port:
                  name: http
