apiVersion: apps/v1
kind: Deployment
metadata:
  name: baby-monitor
spec:
  replicas: 1 # rooms live in memory
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: baby-monitor
  template:
    metadata:
      labels:
        app: baby-monitor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: baby-monitor
          image: ghcr.io/orriborri/homelab-baby-monitor:1a48c2ab95dd25b8fd1177a3c2646d411f593fcb@sha256:89c5d7981e2e7d104e4b2eb62332677f47c74e019ff7db77d99dab881b9e1469
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
