apiVersion: apps/v1
kind: Deployment
metadata:
  name: baby-monitor
spec:
  replicas: 1 # rooms live in memory
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: baby-monitor
  template:
    metadata:
      labels:
        app: baby-monitor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: baby-monitor
          image: ghcr.io/orriborri/homelab-baby-monitor:a1347348dab1fa1c51f96799b26d16a176717e11@sha256:6bc1f69295ee802acb9eebeeab4c6d087218a79c9256b34221a7c7c033e4e732
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
