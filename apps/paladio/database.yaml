apiVersion: apps/v1
kind: Deployment
metadata:
  name: paladio-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paladio-db
  template:
    metadata:
      labels:
        app: paladio-db
    spec:
      containers:
        - name: db
          image: timescale/timescaledb:2.30.2-pg16
          env:
            - name: POSTGRES_DB
              value: paladio
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paladio
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: pg
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, paladio]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paladio-db
---
apiVersion: v1
kind: Service
metadata:
  name: paladio-db
spec:
  selector:
    app: paladio-db
  ports:
    - name: pg
      port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paladio-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paladio-redis
  template:
    metadata:
      labels:
        app: paladio-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: paladio-redis
spec:
  selector:
    app: paladio-redis
  ports:
    - name: redis
      port: 6379
