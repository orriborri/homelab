apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sump-it
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/app-root: /brew
spec:
  ingressClassName: private
  tls:
    - secretName: orriborri-com-tls
      hosts:
        - sump.orriborri.com
  rules:
    - host: sump.orriborri.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sump-it
                port:
                  name: api
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sump-it
                port:
                  number: 80
