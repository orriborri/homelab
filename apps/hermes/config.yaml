# Seeded only when the persistent configuration does not exist.
# Configure the model with `hermes setup` before enabling conversations.
database:
  journal_mode: wal
dashboard:
  public_url: https://hermes.orriborri.com
  # Only the private ingress controller may supply forwarding headers.
  # Refresh this address if its pod is replaced.
  trusted_proxies:
    - 10.244.1.33
terminal:
  backend: local
  cwd: /opt/data/workspace/homelab
  home_mode: profile
agent:
  max_turns: 30

# Knowledge ingestion runs independently in the Pasta pod.
mcp_servers:
  pasta:
    url: http://pasta-mcp.hermes.svc.cluster.local:8000/mcp/
    headers:
      Authorization: Bearer ${PASTA_MCP_TOKEN}
    connect_timeout: 10
    timeout: 60
    tools:
      include:
      - search_knowledge
      - get_changes
      - get_entity
      - get_related
      - get_evidence
      - get_context
      - get_timeline
      resources: false
      prompts: false
