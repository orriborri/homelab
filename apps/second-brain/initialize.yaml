apiVersion: batch/v1
kind: Job
metadata:
  name: second-brain-initialize-v1
spec:
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: initialize
          image: nousresearch/hermes-agent:v0.23.4@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f
          command:
            - python3
            - -c
            - |
              from pathlib import Path
              root = Path('/storage/second-brain')
              for name in ('vault', 'evidence/gmail', 'proposals', 'registry'):
                  path = root / name
                  path.mkdir(parents=True, exist_ok=True, mode=0o750)
              print('Second-brain directories ready; existing files preserved.')
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: documents
              mountPath: /storage
      volumes:
        - name: documents
          persistentVolumeClaim:
            claimName: pasta-workspace
