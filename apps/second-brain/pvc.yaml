apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Preserve the existing claim and its contents during the ownership transfer.
  name: pasta-workspace
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: homelab-nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
