apiVersion: batch/v1
kind: CronJob
metadata:
  name: firefly-cron
spec:
  schedule: "0 3 * * *"
  timeZone: Europe/Helsinki
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: cron
              image: docker.io/curlimages/curl:8.17.0
              command: [sh, -ec]
              args:
                - 'curl --fail --silent --show-error --max-time 240 "http://firefly/api/v1/cron/$STATIC_CRON_TOKEN"'
              env:
                - name: STATIC_CRON_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: firefly-secrets
                      key: STATIC_CRON_TOKEN
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
