apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: firefly-uploads
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: syno-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: firefly
spec:
  type: ClusterIP
  selector:
    app: firefly
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: firefly
  template:
    metadata:
      labels:
        app: firefly
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: wait-for-postgres
          image: docker.io/library/postgres:18.7-bookworm
          command: [sh, -ec]
          args:
            - until pg_isready -h firefly-postgres -U firefly -d firefly; do sleep 3; done
      containers:
        - name: firefly
          image: docker.io/fireflyiii/core:version-6.7.9
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: firefly-config
            - secretRef:
                name: firefly-secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/storage/upload
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: firefly-uploads
