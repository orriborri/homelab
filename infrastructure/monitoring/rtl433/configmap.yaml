apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-rtl433
  namespace: rtl433
data:
  telegraf.conf: |
    [agent]
      omit_hostname = true
      flush_interval = "10s"
      round_interval = false

    [[outputs.influxdb_v2]]
      urls = ["http://influxdb.influxdb.svc.cluster.local:8086"]
      token = "${INFLUXDB_TOKEN}"
      organization = "homelab"
      bucket = "rtl433"

    [[inputs.mqtt_consumer]]
      servers = ["tcp://mqtt.default.svc.cluster.local:1883"]
      topics = ["rtl_433/rpi3b/events"]
      username = "${MQTT_USERNAME}"
      password = "${MQTT_PASSWORD}"
      client_id = "telegraf-rtl433"
      qos = 0
      persistent_session = false
      data_format = "json"
      name_override = "rtl433"
      tag_keys = ["model", "id", "channel", "subtype", "type", "protocol"]
