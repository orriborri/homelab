apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: observability-metrics
  namespace: observability
spec:
  interval: 1h
  timeout: 15m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.1.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    fullnameOverride: observability-metrics
    # Talos control-plane components do not expose these scrape endpoints.
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeProxy: false
    grafana:
      enabled: true
      # The chart generates a random password in its Kubernetes Secret.
      ingress:
        enabled: true
        ingressClassName: private
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - grafana.orriborri.com
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.orriborri.com
      persistence:
        enabled: true
        storageClassName: syno-storage
        accessModes: [ReadWriteOnce]
        size: 5Gi
      deploymentStrategy:
        type: Recreate
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 768Mi
      additionalDataSources:
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://observability-loki-gateway.observability.svc.cluster.local
          jsonData:
            maxLines: 1000
    alertmanager:
      alertmanagerSpec:
        retention: 120h
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: syno-storage
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 2Gi
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
    prometheus:
      prometheusSpec:
        retention: 14d
        retentionSize: 20GB
        scrapeInterval: 30s
        evaluationInterval: 30s
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: syno-storage
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 30Gi
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 2Gi
