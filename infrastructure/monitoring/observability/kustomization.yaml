apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - metrics.yaml
  - loki.yaml
  - alloy.yaml
  - influxdb-datasource.yaml
  - rtl433-datasource.yaml
  - bluetooth-datasource.yaml
configMapGenerator:
  - name: rtl433-dashboard
    files:
      - dashboards/rtl433.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: bluetooth-dashboard
    files:
      - dashboards/bluetooth.json
    options:
      labels:
        grafana_dashboard: "1"
