apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: observability-alloy
  namespace: observability
spec:
  interval: 1h
  timeout: 10m
  dependsOn:
    - name: observability-loki
  chart:
    spec:
      chart: alloy
      version: 1.15.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    fullnameOverride: observability-alloy
    controller:
      type: deployment
      replicas: 1
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: 192.168.11.6
        external-dns.alpha.kubernetes.io/exclude: "true"
    alloy:
      extraPorts:
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      configMap:
        content: |
          discovery.kubernetes "pods" {
            role = "pod"
          }
          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            rule {
              target_label = "cluster"
              replacement  = "homelab"
            }
          }
          loki.source.kubernetes "pod_logs" {
            targets    = discovery.relabel.pod_logs.output
            forward_to = [loki.write.local.receiver]
          }
          loki.write "local" {
            endpoint {
              url = "http://observability-loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
            }
          }
          // OTLP from the Home Assistant otelcol add-on (LAN only, no auth).
          otelcol.receiver.otlp "ha" {
            http {
              endpoint = "0.0.0.0:4318"
            }
            output {
              logs    = [otelcol.exporter.loki.ha.input]
              metrics = [otelcol.exporter.prometheus.ha.input]
            }
          }
          otelcol.exporter.loki "ha" {
            forward_to = [loki.write.local.receiver]
          }
          otelcol.exporter.prometheus "ha" {
            forward_to = [prometheus.remote_write.local.receiver]
          }
          prometheus.remote_write "local" {
            endpoint {
              url = "http://observability-metrics-prometheus.observability.svc.cluster.local:9090/api/v1/write"
            }
          }
