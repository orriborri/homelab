apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-bluetooth
  namespace: bluetooth
data:
  telegraf.conf: |
    [agent]
      omit_hostname = true
      flush_interval = "10s"
      round_interval = false

    [[outputs.influxdb_v2]]
      urls = ["http://influxdb.influxdb.svc.cluster.local:8086"]
      token = "${INFLUXDB_TOKEN}"
      organization = "homelab"
      bucket = "bluetooth"

    [[inputs.mqtt_consumer]]
      servers = ["tcp://mqtt.default.svc.cluster.local:1883"]
      topics = ["home/TheengsGateway/BTtoMQTT"]
      username = "${MQTT_USERNAME}"
      password = "${MQTT_PASSWORD}"
      client_id = "telegraf-bluetooth"
      qos = 0
      persistent_session = false
      data_format = "json"
      name_override = "bluetooth"
      tag_keys = ["id", "name", "brand", "model", "model_id", "type"]
