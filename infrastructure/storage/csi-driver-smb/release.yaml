apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-smb
spec:
  interval: 1h
  timeout: 5m
  chart:
    spec:
      chart: csi-driver-smb
      version: 1.20.4
      sourceRef:
        kind: HelmRepository
        name: csi-driver-smb
        namespace: flux-system
  values:
    windows:
      enabled: false
    linux:
      kubelet: /var/lib/kubelet
