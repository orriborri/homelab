apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.23.0@sha256:1854499e2b08cee47c40a08e356bff20dcb192dbcfde8378fc3f900f12cad5a3
          args:
            - --source=service
            - --source=ingress
            # TODO: replace annotation filter with ingress class filter, which will be supported in a future version of external-dns
            # - --ingress-class=private
            - --annotation-filter=external-dns.alpha.kubernetes.io/exclude notin (true)
            - --domain-filter=orriborri.com
            - --domain-filter=vetelainen.fi
            - --provider=cloudflare
            - --cloudflare-dns-records-per-page=5000
            - --request-timeout=2m
          env:
            - name: CF_API_EMAIL
              value: ${CLOUDFLARE_EMAIL}
            - name: CF_API_TOKEN
              value: ${EXTERNAL_DNS_CLOUDFLARE_API_TOKEN}
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
      securityContext:
        fsGroup: 65534 # For ExternalDNS to be able to read Kubernetes token files
