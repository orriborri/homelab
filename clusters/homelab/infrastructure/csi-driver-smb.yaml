apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: csi-driver-smb
spec:
  interval: 1h
  timeout: 10m
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/storage/csi-driver-smb
  dependsOn:
    - name: sources
  prune: true
  wait: true
