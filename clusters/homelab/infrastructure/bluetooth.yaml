apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bluetooth
spec:
  interval: 1h
  timeout: 10m
  retryInterval: 10s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/monitoring/bluetooth
  dependsOn:
    - name: influxdb
    - name: mosquitto
    - name: observability
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
