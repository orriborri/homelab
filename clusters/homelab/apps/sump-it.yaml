apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sump-it
spec:
  interval: 1h
  timeout: 10m
  retryInterval: 10s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/sump-it
  prune: true
  wait: true
  dependsOn:
    - name: shared-postgres
    - name: ingress-nginx-private
