apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grocy
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 10s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/grocy
  prune: true
  wait: true
  dependsOn:
    - name: cert-manager
    - name: ingress-nginx-public
    - name: nfs-subdir-external-provisioner
