apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: second-brain
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/second-brain
  # Storage and transferred inventory must never be garbage-collected.
  prune: false
  wait: true
  dependsOn:
    - name: nfs-subdir-external-provisioner
