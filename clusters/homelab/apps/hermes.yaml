apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
spec:
  interval: 1h
  timeout: 10m
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/hermes
  prune: true
  wait: true
  dependsOn:
    - name: synology-csi
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
