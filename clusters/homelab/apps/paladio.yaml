apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paladio
spec:
  interval: 1h
  timeout: 10m
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/paladio
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
