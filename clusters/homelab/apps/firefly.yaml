apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: firefly
spec:
  interval: 1h
  timeout: 15m
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/firefly
  prune: true
  wait: true
  dependsOn:
    - name: synology-csi
    - name: ingress-nginx-private
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
