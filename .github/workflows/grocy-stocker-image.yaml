name: grocy-stocker-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/grocy-stocker-image.yaml
      - apps/grocy-stocker/Dockerfile
      - apps/grocy-stocker/package.json
      - apps/grocy-stocker/src/**
      - apps/grocy-stocker/public/**
      - apps/grocy-stocker/test/**

permissions:
  contents: read
  packages: write

concurrency:
  group: grocy-stocker-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/${{ github.repository }}-grocy-stocker:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: npm test --prefix apps/grocy-stocker
      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE" apps/grocy-stocker
      - name: Publish image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
